name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # Key and SSH tests create throwaway keys with these tools and run a local sshd (skipped without them).
      - run: sudo apt-get update -q && sudo apt-get install -y -q putty-tools openssh-server openssl
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test packages
        run: |
          for p in packages/*/; do
            echo "::group::$p"
            if grep -q flutter_test "$p/pubspec.yaml"; then (cd "$p" && flutter test); else (cd "$p" && dart test); fi
            echo "::endgroup::"
          done
