include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - lib/l10n/gen/**
    - build/**
    - android/**
    - windows/**
    - linux/**
    # Vendored upstream code, kept as it was apart from the patches its README lists.
    - packages/re_editor/**

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_final_locals: true
    require_trailing_commas: false
    avoid_print: true
