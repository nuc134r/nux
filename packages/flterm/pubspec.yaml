name: flterm
description: Flutter terminal widget on top of Ghostty's libghostty-vt engine.
version: 0.0.6+nux.1
publish_to: none
homepage: https://github.com/elias8/libghostty
repository: https://github.com/elias8/libghostty/tree/main/packages/flterm
issue_tracker: https://github.com/elias8/libghostty/issues
resolution: workspace

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - terminal
  - terminal-emulator
  - ghostty
  - libghostty
  - vt100

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  cupertino_ui: ^1.0.2
  flutter:
    sdk: flutter
  image: ^4.12.0
  libghostty: ^0.0.13
  material_ui: ^1.2.0
  meta: ^1.19.0
