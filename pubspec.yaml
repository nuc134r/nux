name: nux
description: "SSH/SFTP client, port forwarder and mobile IDE."
publish_to: 'none'

# The release version comes from the git tag (tool/version.sh); this one is only used for local builds.
version: 0.6.0+1

environment:
  sdk: ^3.13.7

# Pub workspace: the app and its own packages resolve together (one pubspec.lock).
workspace:
  - packages/nux_backend
  - packages/tab_switcher
  - packages/flterm

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nux_backend: any
  tab_switcher: any

  clock: ^1.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.2
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  # Built from source by its build hook (libzt via CMake); pinned to a commit until 2.0 is on pub.dev.
  zerotier_sockets:
    git:
      url: https://github.com/nuc134r/zerotier_sockets_flutter.git
      ref: 6243945ea31a23ffbcd4e4a61237efa23e04fc40
  dartssh2: ^4.1.0
  flterm:
    path: packages/flterm
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0
  asn1lib: ^1.6.8
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  device_info_plus: ^13.3.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  flutter_markdown_plus: ^1.0.12
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  test: ^1.30.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
    - CHANGELOG.md
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
        - asset: assets/fonts/JetBrainsMono-Italic[wght].ttf
          style: italic
