name: nux
description: "SSH/SFTP client, port forwarder and mobile IDE."
publish_to: 'none'

# The release version comes from the git tag (tool/version.sh); this one is only used for local builds.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Pub workspace: the app and its own packages resolve together (one pubspec.lock).
workspace:
  - packages/nux_backend

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nux_backend: any

  clock: ^1.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.2
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
    - CHANGELOG.md
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
        - asset: assets/fonts/JetBrainsMono-Italic[wght].ttf
          style: italic
