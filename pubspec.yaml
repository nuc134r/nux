name: nux
description: "SSH/SFTP client, port forwarder and mobile IDE."
publish_to: 'none'

# The release version comes from the git tag (tool/version.sh); this one is only used for local builds.
version: 0.11.16+1

environment:
  sdk: ^3.13.7

# Pub workspace: the app and its own packages resolve together (one pubspec.lock).
workspace:
  - packages/nux_backend
  - packages/tab_switcher
  - packages/flterm
  - packages/re_editor

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nux_backend: any
  tab_switcher: any

  clock: ^1.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.2
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  # Built from source by its build hook (libzt via CMake); pinned to a commit until 2.0 is on pub.dev.
  zerotier_sockets:
    git:
      url: https://github.com/nuc134r/zerotier_sockets_flutter.git
      ref: c62b2a98a90c7e58baf57411e5241cd89e94ccfc
  dartssh2: ^4.1.0
  flterm:
    path: packages/flterm
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0
  asn1lib: ^1.6.8
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  device_info_plus: ^13.3.0
  re_editor:
    path: packages/re_editor
  re_highlight: ^0.0.3
  flutter_markdown_plus: ^1.0.12
  flutter_foreground_task: ^11.0.3
  webview_flutter: ^4.14.1
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  test: ^1.30.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
    - CHANGELOG.md
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
        - asset: assets/fonts/JetBrainsMono-Italic[wght].ttf
          style: italic
    - family: Fira Code
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
    - family: Hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
        - asset: assets/fonts/Hack-Bold.ttf
          weight: 700
        - asset: assets/fonts/Hack-Italic.ttf
          style: italic
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.otf
        - asset: assets/fonts/SourceCodePro-Bold.otf
          weight: 700
        - asset: assets/fonts/SourceCodePro-It.otf
          style: italic

# memory_guard: true builds libzt with a guarded allocator: an overrun or a write after free inside ZeroTier
# faults at once, in libzt, with its function in the crash report (see zerotier_sockets' hook/build.dart).
# It found the heap corruption fixed in 0.11.11; off since, as each of libzt's ~170 allocations a second
# then maps its own pages, and Android killed nux in the background for the CPU that took.
hooks:
  user_defines:
    zerotier_sockets:
      memory_guard: false
